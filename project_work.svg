<svg xmlns="http://www.w3.org/2000/svg" width="150" height="120" viewBox="0 0 150 120">
  <!-- Тетрадка -->
  <rect x="20" y="20" width="70" height="80" fill="#ffffff" stroke="#333" stroke-width="3" rx="5"/>
  <!-- Линии страниц -->
  <line x1="30" y1="35" x2="80" y2="35" stroke="#999" stroke-width="2"/>
  <line x1="30" y1="50" x2="80" y2="50" stroke="#999" stroke-width="2"/>
  <line x1="30" y1="65" x2="80" y2="65" stroke="#999" stroke-width="2"/>
  <line x1="30" y1="80" x2="80" y2="80" stroke="#999" stroke-width="2"/>
  <!-- Спираль -->
  <circle cx="25" cy="35" r="2" fill="#333"/>
  <circle cx="25" cy="50" r="2" fill="#333"/>
  <circle cx="25" cy="65" r="2" fill="#333"/>
  <circle cx="25" cy="80" r="2" fill="#333"/>
  
  <!-- Карандаш рядом -->
  <rect x="100" y="30" width="15" height="60" fill="#ffeb3b" stroke="#333" stroke-width="2"/>
  <!-- Грифель -->
  <polygon points="100,30 115,30 107.5,15" fill="#333" stroke="#333" stroke-width="2"/>
  <!-- Ластик -->
  <rect x="100" y="90" width="15" height="10" fill="#e57373" stroke="#333" stroke-width="2"/>
</svg>
