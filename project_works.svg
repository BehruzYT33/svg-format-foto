<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Тетрадка -->
  <rect x="2" y="3" width="10" height="16" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1" rx="1"/>
  <!-- Линии страниц -->
  <line x1="3" y1="6" x2="11" y2="6" stroke="#90caf9" stroke-width="0.5"/>
  <line x1="3" y1="9" x2="11" y2="9" stroke="#90caf9" stroke-width="0.5"/>
  <line x1="3" y1="12" x2="11" y2="12" stroke="#90caf9" stroke-width="0.5"/>
  <line x1="3" y1="15" x2="11" y2="15" stroke="#90caf9" stroke-width="0.5"/>
  <!-- Спираль -->
  <circle cx="2.5" cy="6" r="0.5" fill="#1e88e5"/>
  <circle cx="2.5" cy="9" r="0.5" fill="#1e88e5"/>
  <circle cx="2.5" cy="12" r="0.5" fill="#1e88e5"/>
  <circle cx="2.5" cy="15" r="0.5" fill="#1e88e5"/>
  
  <!-- Карандаш рядом -->
  <rect x="14" y="5" width="2" height="10" fill="#ffeb3b" stroke="#f57f17" stroke-width="0.5"/>
  <!-- Грифель -->
  <polygon points="14,5 16,5 15,2" fill="#424242" stroke="#424242" stroke-width="0.5"/>
  <!-- Ластик -->
  <rect x="14" y="15" width="2" height="2" fill="#f48fb1" stroke="#ad1457" stroke-width="0.5"/>
</svg>
